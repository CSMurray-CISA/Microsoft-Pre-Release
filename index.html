<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SOC CVRF Dashboard (PGP-enabled)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- FIXED: Proper OpenPGP.js + JSZip CDN includes -->
https://cdn.jsdelivr.net/npm/openpgp@5.10.1/dist/openpgp.min.js</script>
https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js</script>

<style>
  body { font-family: system-ui, sans-serif; margin:16px; background:#111; color:#eee; }
  h1 { margin-bottom:12px; font-size:22px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  input,select,button { background:#222; color:#eee; border:1px solid #555; border-radius:4px; padding:6px 8px; font:inherit; }
  input[type="search"] { width:320px; }
  .table-wrap { border:1px solid #333; border-radius:6px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#000; color:#ddd; }
  th,td { padding:8px; border-bottom:1px solid #333; white-space:nowrap; }
  th { background:#222; position:sticky; top:0; cursor:pointer; }
  tr:hover { background:#1b1b1b; }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; }
  .CRITICAL { background:#8B0000; color:#fff; }
  .HIGH { background:#C0392B; color:#fff; }
  .MEDIUM { background:#F39C12; color:#111; }
  .LOW { background:#2ECC71; color:#111; }
  .UNKNOWN { background:#777; color:#000; }
  #stats { margin-top:6px; font-size:12px; color:#ccc; }
  #msg { margin-left:8px; font-size:12px; color:#ccc; }
  .warn { color:#E67E22; font-weight:600; }
</style>
</head>
<body>

<h1>SOC CVRF Dashboard</h1>

<div class="controls">
  <input id="cvrf" type="file" accept=".json" />
  <button id="loadBtn">Load JSON</button>

  <input id="pgpFile" type="file" accept=".pgp,.gpg" />
  <input id="pgpPass" type="password" placeholder="PGP password…" />
  <button id="decryptBtn">Decrypt & Load PGP</button>

  <input id="q" type="search" placeholder="Filter (CVE, Description…)" />

  <label>Severity:
    <select id="sev">
      <option value="">All</option>
      <option>CRITICAL</option><option>HIGH</option>
      <option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option>
    </select>
  </label>

  <label>Automatable:
    <select id="auto">
      <option value="">All</option>
      <option>Yes</option><option>No</option><option>Automatable</option>
    </select>
  </label>

  <button id="exportCsvBtn" disabled>Download CSV</button>
  <button id="exportXlsBtn" disabled>Download Excel (.xls)</button>

  <span id="msg"></span>
</div>

<div class="table-wrap">
  <table id="grid">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<div id="stats"></div>

<script>
/* ===============================================================
   Dashboard Setup
   =============================================================== */
const COLS = [
  "CVE-ID","Description","SSVC","CVSS","Severity",
  "Impact","Automatable","Internet Exposed","Forensic Triage Required"
];

let rows = [];
let filtered = [];
let sortCol = "CVSS";
let sortDir = -1;

const $ = sel => document.querySelector(sel);

function flash(msg, warn=false) {
  const m = $("#msg");
  m.textContent = msg;
  m.classList.toggle("warn", warn);
  setTimeout(()=>{ m.textContent=""; m.classList.remove("warn"); }, 3500);
}

function safeStr(v) {
  if (v == null) return "";
  return (typeof v === "string" ? v : JSON.stringify(v));
}
function firstText(...vals) {
  for (const v of vals) {
    const s = safeStr(v).trim();
    if (s) return s;
  }
  return "";
}

/* ===============================================================
   CVSS + Severity
   =============================================================== */
function pickCVSS(sets) {
  if (!Array.isArray(sets)) return null;
  const ranked = sets.map(s => {
    const ver = safeStr(s.Version || s.version);
    let base = parseFloat(s.BaseScore || s.baseScore);
    if (isNaN(base)) base = null;
    const pri = {"3.1":3,"3.0":2,"2.0":1}[ver] || 0;
    return { pri, base };
  }).sort((a,b)=> (b.pri - a.pri) || ((b.base ?? 0) - (a.base ?? 0)));
  return ranked.length ? ranked[0].base : null;
}

function severityFromScore(n) {
  if (n == null || isNaN(n)) return "UNKNOWN";
  if (n >= 9.0) return "CRITICAL";
  if (n >= 7.0) return "HIGH";
  if (n >= 4.0) return "MEDIUM";
  if (n >= 0.0) return "LOW";
  return "UNKNOWN";
}

/* ===============================================================
   Extract Vulnerability (SSVC / Impact / Automatable working)
   =============================================================== */
function extract(v) {
  const cve = Array.isArray(v.CVE) ? v.CVE[0] : v.CVE || "";

  let desc = safeStr(v.Title?.Value);
  if (!desc) {
    for (const n of (v.Notes || [])) {
      const t = safeStr(n.Title).toLowerCase();
      if (["summary","description","title"].includes(t)) {
        desc = firstText(n.Value, n.Text);
        break;
      }
    }
  }

  const cvssBase = pickCVSS(v.CVSSScoreSets || []);
  const severity = severityFromScore(cvssBase);

  let ssvc = "";
  for (const n of (v.Notes || [])) {
    const t = safeStr(n.Title).toLowerCase();
    if (t.includes("ssvc")) { ssvc = firstText(n.Text, n.Value); break; }
  }

  let impact = "";
  let autom = "";

  for (const th of (v.Threats || [])) {
    if (!th || typeof th !== "object") continue;
    const type = safeStr(th.Type).toLowerCase();

    if (type.includes("impact") && Array.isArray(th.Details)) {
      impact = firstText(...th.Details.map(d => d?.Value));
    }

    if (type.includes("automatable") && Array.isArray(th.Details)) {
      const raw = firstText(...th.Details.map(d => d?.Value)).toLowerCase();
      if (raw.includes("yes")) autom = "Yes";
      else if (raw.includes("no")) autom = "No";
      else autom = "Automatable";
    }
  }

  return {
    "CVE-ID": cve,
    "Description": desc,
    "SSVC": ssvc,
    "CVSS": cvssBase == null ? "" : cvssBase.toFixed(1),
    "Severity": severity,
    "Impact": impact,
    "Automatable": autom,
    "Internet Exposed": "",
    "Forensic Triage Required": ""
  };
}

/* ===============================================================
   Parse full CVRF
   =============================================================== */
function parseCVRF(json) {
  const vulns = Array.isArray(json?.Vulnerability)
    ? json.Vulnerability
    : Array.isArray(json?.Document?.Vulnerability)
      ? json.Document.Vulnerability
      : [];

  const out = vulns.map(extract);
  out.sort((a,b) => parseFloat(b.CVSS || 0) - parseFloat(a.CVSS || 0));
  return out;
}

/* ===============================================================
   Render table
   =============================================================== */
function buildHeader() {
  const tr=document.createElement("tr");
  COLS.forEach(c=>{
    const th=document.createElement("th");
    th.textContent=c;
    th.onclick=()=>{
      if (sortCol === c) sortDir *= -1;
      else { sortCol = c; sortDir = 1; }
      render();
    };
    tr.appendChild(th);
  });
  $("#grid thead").innerHTML="";
  $("#grid thead").appendChild(tr);
}

function applyFilters() {
  const q = ($("#q").value || "").toLowerCase();
  const sev = $("#sev").value;
  const auto = $("#auto").value;

  filtered = rows.filter(r => {
    const okSev = !sev || r.Severity === sev;
    const okAuto = !auto || r.Automatable === auto;
    const hay = COLS.map(c => safeStr(r[c]).toLowerCase()).join("\u0000");
    const okQ = !q || hay.includes(q);
    return okSev && okAuto && okQ;
  });

  render();
}

function render() {
  filtered.sort((a,b)=>{
    const av=a[sortCol]||"", bv=b[sortCol]||"";
    if (sortCol==="CVSS") return ((parseFloat(av)||0) - (parseFloat(bv)||0))*sortDir;
    return av.localeCompare(bv)*sortDir;
  });

  const body=$("#grid tbody");
  body.innerHTML="";

  for (const r of filtered) {
    const tr=document.createElement("tr");
    for (const c of COLS) {
      const td=document.createElement("td");
      const val=r[c]||"";
      if (c === "Severity") {
        const b=document.createElement("span");
        b.className="badge "+val;
        b.textContent=val;
        td.appendChild(b);
      } else td.textContent=val;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  $("#stats").textContent=`Showing ${filtered.length} of ${rows.length}`;
  enableExports(filtered.length > 0);
}

/* ===============================================================
   Export CSV/XLS
   =============================================================== */
function enableExports(ok) {
  $("#exportCsvBtn").disabled = !ok;
  $("#exportXlsBtn").disabled = !ok;
}
function toCSV(data) {
  const esc=v=>{
    const s=String(v??"");
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  };
  const lines=[COLS.join(",")];
  for(const r of data) lines.push(COLS.map(c=>esc(r[c])).join(","));
  return lines.join("\n");
}
function exportCSV() {
  const blob=new Blob([toCSV(filtered)],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  trigger(url,"soc_table.csv");
}
function exportXLS() {
  const head="<tr>"+COLS.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  const body=filtered.map(r=>"<tr>"+COLS.map(c=>`<td>${r[c]||""}</td>`).join("")+"</tr>").join("");
  const html=`<!doctype html><html><body><table>${head}${body}</table></body></html>`;
  const blob=new Blob([html],{type:"application/vnd.ms-excel"});
  const url=URL.createObjectURL(blob);
  trigger(url,"soc_table.xls");
}
function trigger(url,fn){
  const a=document.createElement("a");
  a.href=url; a.download=fn;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===============================================================
   Load plain JSON file
   =============================================================== */
$("#loadBtn").onclick = async ()=>{
  const f=$("#cvrf").files[0];
  if (!f) return flash("Select JSON",true);
  try {
    const txt=await readFileText(f);
    const json=JSON.parse(txt);
    rows=parseCVRF(json);
    filtered=rows.slice();
    buildHeader();
    render();
    flash("Loaded JSON");
  } catch(e){
    flash("JSON error: "+e,true);
  }
};

/* ===============================================================
   FULL PGP DECRYPT WORKS HERE
   =============================================================== */
$("#decryptBtn").onclick = async ()=>{
  const f=$("#pgpFile").files[0];
  const pass=$("#pgpPass").value;

  if(!f) return flash("Select PGP file",true);
  if(!pass) return flash("Enter password",true);

  try {
    const text=await readFileText(f);
    const bytes=await readFileBytes(f);
    let message;

    if (text.startsWith("-----BEGIN PGP MESSAGE-----")) {
      message = await openpgp.readMessage({
        armoredMessage: text
      });
    } else {
      message = await openpgp.readMessage({
        binaryMessage: bytes
      });
    }

    const { data } = await openpgp.decrypt({
      message,
      passwords: [pass],
      format: "binary"
    });

    const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
    const isZip = u8[0] === 0x50 && u8[1] === 0x4B;

    let jsonText;

    if (isZip) {
      const zip = await JSZip.loadAsync(u8);
      let jsonPath = "";
      zip.forEach((p,e)=>{ if(!e.dir && p.toLowerCase().endsWith(".json")) jsonPath=p; });
      if (!jsonPath) throw new Error("No JSON in decrypted ZIP");
      jsonText = await zip.file(jsonPath).async("string");
    } else {
      jsonText = new TextDecoder().decode(u8);
    }

    const json = JSON.parse(jsonText);
    rows = parseCVRF(json);
    filtered = rows.slice();
    buildHeader();
    render();

    flash("PGP decrypted & loaded");
  } catch(e){
    console.error(e);
    flash("Decrypt failed: "+e,true);
  }
};

/* Filters */
$("#q").oninput = applyFilters;
$("#sev").onchange = applyFilters;
$("#auto").onchange = applyFilters;

/* Export */
$("#exportCsvBtn").onclick = exportCSV;
$("#exportXlsBtn").onclick = exportXLS;
</script>

</body>
</html>
