<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Microsoft Patch Tuesday Pre-Release Dashboard</title>

<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111;
    --surface: #fafafa;
    --hover: #f6faff;
    --border: #ddd;
    --muted: #666;

    --sev-critical: #b00020;
    --sev-high:     #d93025;
    --sev-medium:   #f9ab00;
    --sev-low:      #34a853;
    --sev-unknown:  #9aa0a6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --fg: #e8eaed;
      --surface: #11161c;
      --hover: #18202a;
      --border: #2b2f36;
      --muted: #9aa0a6;
    }
  }

  html[data-theme="light"] {
    --bg:#fff; --fg:#111; --surface:#fafafa; --hover:#f6faff; --border:#ddd; --muted:#666;
  }
  html[data-theme="dark"] {
    --bg:#0b0f14; --fg:#e8eaed; --surface:#11161c; --hover:#18202a; --border:#2b2f36; --muted:#9aa0a6;
  }

  body { font-family:system-ui,Arial; margin:16px; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 12px; }

  .grid { display:grid; gap:8px; }
  .inputs { display:grid; gap:8px; grid-template-columns:repeat(2,minmax(220px,1fr)); }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  input, select, button {
    font:inherit;
    padding:6px 8px;
    background:var(--surface);
    color:var(--fg);
    border:1px solid var(--border);
    border-radius:4px;
  }

  .badge {
    padding:2px 8px;
    border-radius:10px;
    font-size:12px;
  }
  .CRITICAL { background:var(--sev-critical); color:#fff; }
  .HIGH     { background:var(--sev-high); color:#fff; }
  .MEDIUM   { background:var(--sev-medium); color:#111; }
  .LOW      { background:var(--sev-low); color:#111; }
  .UNKNOWN  { background:var(--sev-unknown); color:#111; }

  .table-wrap { margin-top:10px; overflow:auto; border:1px solid var(--border); border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--surface); cursor:pointer; }
  tr:hover { background:var(--hover); }

  .muted { color:var(--muted); }
</style>
</head>

<body>
<h1>Microsoft Patch Tuesday Pre-Release Dashboard</h1>

<div class="grid">

  <div class="inputs">
    <label>
      <strong>CVRF JSON</strong><br/>
      <input id="cvrf" type="file" accept=".json" />
    </label>

    <label>
      <strong>Enrichment CSV (optional)</strong><br/>
      <input id="enrich" type="file" accept=".csv" />
      <div class="muted" style="margin-top:4px">
        Columns: CVE-ID, Internet Exposed, Forensic Triage Required
      </div>
    </label>
  </div>

  <div class="controls">
    <button id="loadBtn">Load</button>
    <button id="exportCsvBtn" disabled>Export CSV</button>
    <button id="exportXlsBtn" disabled>Export Excel</button>
    <button id="exportJsonBtn" disabled>Export JSON</button>
    <button id="copyBtn" disabled>Copy rows</button>

    <label>Theme:
      <select id="theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>

    <span id="msg" class="muted"></span>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Filter (CVE, Description, SSVC…)" />

    <label>Severity:
      <select id="sev">
        <option value="">All</option>
        <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option>
      </select>
    </label>

    <label>Automatable:
      <select id="auto">
        <option value="">All</option>
        <option>Yes</option><option>No</option><option>Automatable</option><option>Unknown</option>
      </select>
    </label>

    <label>Internet Exposed:
      <select id="iex">
        <option value="">All</option>
        <option>Yes</option><option>No</option><option>Varies</option><option>Unknown</option>
      </select>
    </label>

    <label>Forensic Triage:
      <select id="tri">
        <option value="">All</option>
        <option>Yes</option><option>No</option><option>Unknown</option>
      </select>
    </label>
  </div>

  <div class="table-wrap">
    <table id="grid">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="muted" id="stats"></div>

</div>

<script>
/* -------- Theme -------- */
(function() {
  const sel = document.getElementById("theme");
  const saved = localStorage.getItem("theme") || "auto";
  sel.value = saved;
  applyTheme(saved);
  sel.onchange = () => {
    localStorage.setItem("theme", sel.value);
    applyTheme(sel.value);
  };
  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
})();

/* -------- Columns (all KEV + Due + Added removed) -------- */
const COLS = [
  "CVE-ID","Description","SSVC","CVSS","Severity","Impact",
  "Automatable","Internet Exposed","Forensic Triage Required"
];

let rows = [];
let filtered = [];
let sortCol = "CVSS";
let sortDir = -1;

/* DOM refs */
const $ = s => document.querySelector(s);
const $head = $("#grid thead");
const $body = $("#grid tbody");

/* Events */
$("#loadBtn").onclick = loadFiles;
$("#q").oninput = applyFilters;
$("#sev").onchange = applyFilters;
$("#auto").onchange = applyFilters;
$("#iex").onchange = applyFilters;
$("#tri").onchange = applyFilters;

$("#exportCsvBtn").onclick = () => dlCSV(filtered);
$("#exportJsonBtn").onclick = () => dlJSON(filtered);
$("#exportXlsBtn").onclick = () => dlXLS(filtered);
$("#copyBtn").onclick = () => navigator.clipboard.writeText(toCSV(filtered));

/* ---- Utility ---- */
function readText(f) {
  return new Promise(res => {
    if (!f) return res(null);
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsText(f);
  });
}

function parseCSV(txt) {
  if (!txt) return [];
  const lines = txt.split(/\r?\n/).filter(x=>x);
  const head = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(",");
    const o = {};
    head.forEach((h,i)=>o[h]=vals[i]?.trim()||"");
    return o;
  });
}

function pickCVSS(sets) {
  if (!Array.isArray(sets) || !sets.length) return {base:""};
  const ranked = sets.map(s=>{
    const ver = (s.Version || "").trim();
    const base = parseFloat(s.BaseScore)||0;
    const pri = {"3.1":3,"3.0":2,"2.0":1}[ver]||0;
    return {ver,base,pri};
  }).sort((a,b)=>(b.pri-a.pri)||(b.base-a.base));
  return {base: ranked[0].base.toFixed(1) };
}

function severity(score) {
  score = parseFloat(score);
  if (isNaN(score)) return "UNKNOWN";
  if (score>=9) return "CRITICAL";
  if (score>=7) return "HIGH";
  if (score>=4) return "MEDIUM";
  return "LOW";
}

/* ---- Parse CVRF ---- */
function parseCVRF(json) {
  const vulns = json.Vulnerability || json.Document?.Vulnerability || [];
  return vulns.map(v => {
    const cve = Array.isArray(v.CVE) ? v.CVE[0] : v.CVE || "";
    const desc = v.Title?.Value || "";
    const cv = pickCVSS(v.CVSSScoreSets||[]);
    return {
      "CVE-ID": cve,
      "Description": desc,
      "SSVC": "",
      "CVSS": cv.base || "",
      "Severity": severity(cv.base),
      "Impact": "",
      "Automatable": "",
      "Internet Exposed": "",
      "Forensic Triage Required": ""
    };
  });
}

/* ---- Merge Enrichment ---- */
function mergeEnrichment(base, recs) {
  const map = new Map();
  for (const r of recs) {
    const cve = r["CVE-ID"];
    if (!cve) continue;
    map.set(cve, {
      "Internet Exposed": r["Internet Exposed"] || "",
      "Forensic Triage Required": r["Forensic Triage Required"] || ""
    });
  }
  base.forEach(b=>{
    const m = map.get(b["CVE-ID"]);
    if (m) Object.assign(b,m);
  });
  return base;
}

/* ---- Build Table ---- */
function buildHeader() {
  $head.innerHTML = "";
  const tr = document.createElement("tr");
  COLS.forEach(c=>{
    const th = document.createElement("th");
    th.textContent = c;
    th.onclick = ()=>{
      sortDir = (sortCol===c ? -sortDir : 1);
      sortCol = c;
      render();
    };
    tr.appendChild(th);
  });
  $head.appendChild(tr);
}

function applyFilters() {
  const q = $("#q").value.toLowerCase();
  const sev = $("#sev").value;
  const auto = $("#auto").value;
  const ie = $("#iex").value;
  const tri = $("#tri").value;

  filtered = rows.filter(r=>{
    if (sev && r.Severity!==sev) return false;
    if (auto && r.Automatable!==auto) return false;
    if (ie && r["Internet Exposed"]!==ie) return false;
    if (tri && r["Forensic Triage Required"]!==tri) return false;

    if (q) {
      const hay = COLS.map(c=>(r[c]||"").toLowerCase()).join("\u0000");
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  render();
}

function render() {
  filtered.sort((x,y)=>{
    if (sortCol==="CVSS") return (parseFloat(x.CVSS||0)-parseFloat(y.CVSS||0))*sortDir;
    return (x[sortCol]||"").localeCompare(y[sortCol]||"")*sortDir;
  });

  $body.innerHTML="";
  filtered.forEach(r=>{
    const tr=document.createElement("tr");
    COLS.forEach(c=>{
      const td=document.createElement("td");
      if (c==="Severity") {
        const b=document.createElement("span");
        b.className="badge "+r[c];
        b.textContent=r[c];
        td.appendChild(b);
      } else td.textContent=r[c];
      tr.appendChild(td);
    });
    $body.appendChild(tr);
  });

  $("#stats").textContent=`Showing ${filtered.length} of ${rows.length}`;

  const dis = filtered.length===0;
  $("#exportCsvBtn").disabled=dis;
  $("#exportXlsBtn").disabled=dis;
  $("#exportJsonBtn").disabled=dis;
  $("#copyBtn").disabled=dis;
}

/* ---- Export ---- */
function toCSV(data) {
  const esc=v=>{
    const s=String(v??"");
    return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
  };
  const lines=[COLS.join(",")];
  data.forEach(r=>lines.push(COLS.map(c=>esc(r[c])).join(",")));
  return lines.join("\n");
}
function dlCSV(data) {
  const blob=new Blob([toCSV(data)],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="patch_pre_release.csv"; a.click();
  URL.revokeObjectURL(url);
}
function dlJSON(data) {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="patch_pre_release.json"; a.click();
  URL.revokeObjectURL(url);
}
function dlXLS(data) {
  let html="<table><tr>"+COLS.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  data.forEach(r=>{
    html+="<tr>"+COLS.map(c=>`<td>${r[c]||""}</td>`).join("")+"</tr>";
  });
  html+="</table>";
  const blob=new Blob([html],{type:"application/vnd.ms-excel"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="patch_pre_release.xls"; a.click();
  URL.revokeObjectURL(url);
}

/* ---- Load ---- */
async function loadFiles() {
  const j = $("#cvrf").files[0];
  if (!j) return alert("Select CVRF JSON");

  const cvrfTxt = await readText(j);
  let json;
  try { json=JSON.parse(cvrfTxt); }
  catch { return alert("Invalid JSON"); }

  rows = parseCVRF(json);

  const e = $("#enrich").files[0];
  if (e) {
    const etxt = await readText(e);
    const recs = parseCSV(etxt);
    rows = mergeEnrichment(rows,recs);
  }

  buildHeader();
  filtered = rows.slice();
  render();
}
</script>

</body>
</html>
