<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SOC CVRF Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
  h1 { font-size: 22px; margin-bottom: 12px; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  input[type="file"], input[type="search"], select, button {
    font: inherit; padding: 6px 8px;
  }
  input[type="search"] { width: 320px; }

  .badge { padding:2px 8px; border-radius:10px; font-size:12px; }
  .CRITICAL { background:#8B0000; color:#fff; }
  .HIGH     { background:#C0392B; color:#fff; }
  .MEDIUM   { background:#F39C12; color:#111; }
  .LOW      { background:#2ECC71; color:#111; }
  .UNKNOWN  { background:#95A5A6; color:#111; }

  .table-wrap { overflow:auto; border:1px solid #ddd; border-radius:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { border-bottom:1px solid #eee; padding:8px; text-align:left; white-space:nowrap; }
  th { background:#fafafa; position:sticky; top:0; cursor:pointer; }
  tr:hover { background:#f6faff; }

  #stats { margin-top:8px; font-size:12px; color:#555; }
</style>
</head>
<body>

<h1>SOC CVRF Dashboard</h1>

<div class="controls">
  <input id="cvrf" type="file" accept=".json" />
  <button id="loadBtn">Load</button>
  <input id="q" type="search" placeholder="Filter (CVE, Description…)" />

  <label>Severity:
    <select id="sev">
      <option value="">All</option><option>CRITICAL</option>
      <option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option>
    </select>
  </label>

  <label>Automatable:
    <select id="auto">
      <option value="">All</option><option>Yes</option><option>No</option><option>Automatable</option>
    </select>
  </label>

  <button id="exportCsvBtn" disabled>Download CSV</button>
  <button id="exportXlsBtn" disabled>Download Excel (.xls)</button>
</div>

<div class="table-wrap">
  <table id="grid">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<div id="stats"></div>

<script>
/* -------- Columns we keep -------- */
const COLS = [
  'CVE-ID','Description','SSVC','CVSS','Severity',
  'Impact','Automatable','Internet Exposed','Forensic Triage Required'
];

let rows = [];
let filtered = [];
let sortCol = 'CVSS';
let sortDir = -1;

const $ = sel => document.querySelector(sel);

/* Parse uploaded file */
function readFile(f) {
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(f);
  });
}

/* Safe CVSS selector */
function pickCVSS(sets) {
  if (!Array.isArray(sets) || !sets.length) return null;
  const ranked = sets.map(it=>{
    const ver = it.Version || it.version || '';
    const base = parseFloat(it.BaseScore || it.baseScore || 'NaN');
    const pri  = {'3.1':3,'3.0':2,'2.0':1}[ver] || 0;
    return {pri, base: isNaN(base)?null:base};
  }).sort((a,b)=> (b.pri - a.pri) || ((b.base||0) - (a.base||0)));
  return ranked[0].base;
}

function severityFromScore(n){
  if(n==null||isNaN(n))return 'UNKNOWN';
  if(n>=9.0)return 'CRITICAL';
  if(n>=7.0)return 'HIGH';
  if(n>=4.0)return 'MEDIUM';
  if(n>=0.0)return 'LOW';
  return 'UNKNOWN';
}

function firstText(...vals){
  for(const v of vals) if(v && typeof v==='string' && v.trim()) return v.trim();
  return '';
}

/* ---------- SAFE extraction ---------- */
function extract(v){
  const cve = Array.isArray(v.CVE) ? v.CVE[0] : v.CVE || '';

  let desc = v.Title?.Value || '';
  if(!desc){
    for(const n of (v.Notes||[])){
      const t=(n.Title||'').toLowerCase();
      if(['summary','description','title'].includes(t)){
        desc=firstText(n.Value,n.Text);
        break;
      }
    }
  }

  const cvss = pickCVSS(v.CVSSScoreSets||[]);
  const severity = severityFromScore(cvss);

  /* SSVC */
  let ssvc='';
  for(const n of (v.Notes||[])){
    const t=(n.Title||'').toLowerCase();
    if(t.includes('ssvc')){
      ssvc = firstText(n.Value,n.Text);
      break;
    }
  }

  /* Impact (SAFE) */
  let impact='';
  for(const th of (v.Threats||[])){
    if (!th || typeof th !== "object") continue;   /* FIX */
    const t = String(th.Type||'').toLowerCase();
    if(t.includes('impact')){
      impact = firstText(th.Description,th.Text,th.Value);
      break;
    }
  }

  /* Automatable (SAFE) */
  let autom='';
  for(const th of (v.Threats||[])){
    if (!th || typeof th !== "object") continue;   /* FIX */
    const val=[th.Description,th.Text,th.Value].filter(Boolean).join(' ').toLowerCase();
    if(val.includes('automatable')){
      if(val.includes('yes')) autom='Yes';
      else if(val.includes('no')) autom='No';
      else autom='Automatable';
      break;
    }
  }

  return {
    'CVE-ID': cve,
    'Description': desc,
    'SSVC': ssvc,
    'CVSS': cvss==null?'':cvss.toFixed(1),
    'Severity': severity,
    'Impact': impact,
    'Automatable': autom,
    'Internet Exposed':'',
    'Forensic Triage Required':''
  };
}

/* Parse entire CVRF */
function parseCVRF(json){
  const vulns = Array.isArray(json?.Vulnerability)
    ? json.Vulnerability
    : Array.isArray(json?.Document?.Vulnerability)
      ? json.Document.Vulnerability
      : [];

  const out = vulns.map(extract);
  out.sort((a,b)=>{
    const as=parseFloat(a.CVSS||0), bs=parseFloat(b.CVSS||0);
    return (bs - as);
  });
  return out;
}

/* ----- UI building ----- */
function buildHeader(){
  const tr=document.createElement('tr');
  COLS.forEach(c=>{
    const th=document.createElement('th');
    th.textContent=c;
    th.onclick=()=>{
      if(sortCol===c) sortDir*=-1;
      else {sortCol=c; sortDir=1;}
      render();
    };
    tr.appendChild(th);
  });
  $('#grid thead').innerHTML='';
  $('#grid thead').appendChild(tr);
}

function applyFilters(){
  const q=($('#q').value||'').toLowerCase();
  const sev=$('#sev').value;
  const auto=$('#auto').value;

  filtered = rows.filter(r=>{
    const okSev=!sev || r.Severity===sev;
    const okAuto=!auto || r.Automatable===auto;
    const hay = COLS.map(c=>String(r[c]||'').toLowerCase()).join('\u0000');
    const okQ = !q || hay.includes(q);
    return okSev && okAuto && okQ;
  });

  render();
}

function render(){
  filtered.sort((x,y)=>{
    const xv=x[sortCol]||'';
    const yv=y[sortCol]||'';
    if(sortCol==='CVSS'){
      return ((parseFloat(xv)||0)-(parseFloat(yv)||0))*sortDir;
    }
    return xv.localeCompare(yv)*sortDir;
  });

  const body=$('#grid tbody');
  body.innerHTML='';
  for(const r of filtered){
    const tr=document.createElement('tr');
    COLS.forEach(c=>{
      const td=document.createElement('td');
      const val=r[c]||'';
      if(c==='Severity'){
        const b=document.createElement('span');
        b.className='badge '+val;
        b.textContent=val;
        td.appendChild(b);
      } else td.textContent=val;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }

  $('#stats').textContent=`Showing ${filtered.length} of ${rows.length}`;
  const disabled = filtered.length===0;
  $('#exportCsvBtn').disabled = disabled;
  $('#exportXlsBtn').disabled = disabled;
}

/* ----- Export ----- */
function toCSV(data){
  const esc=v=>{
    const s=String(v??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  };
  const lines=[COLS.join(',')];
  for(const r of data) lines.push(COLS.map(c=>esc(r[c])).join(','));
  return lines.join('\n');
}

function exportCSV(){
  const blob=new Blob([toCSV(filtered)],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  trigger(url,'soc_table.csv');
}

function exportXLS(){
  const header='<tr>'+COLS.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  const body=filtered
    .map(r=>'<tr>'+COLS.map(c=>`<td>${r[c]||''}</td>`).join('')+'</tr>')
    .join('');
  const html=`<!doctype html><html><body><table>${header}${body}</table></body></html>`;
  const blob=new Blob([html],{type:'application/vnd.ms-excel'});
  const url=URL.createObjectURL(blob);
  trigger(url,'soc_table.xls');
}

function trigger(url,filename){
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* ----- Bind events ----- */
$('#exportCsvBtn').onclick = exportCSV;
$('#exportXlsBtn').onclick = exportXLS;

$('#loadBtn').onclick = async () => {
  const f=$('#cvrf').files[0];
  if(!f){ alert('Select a CVRF JSON file'); return; }
  const txt=await readFile(f);
  let json;
  try { json=JSON.parse(txt); }
  catch { alert('Invalid JSON'); return; }

  rows = parseCVRF(json);
  filtered = rows.slice();
  buildHeader();
  render();
};

$('#q').oninput = applyFilters;
$('#sev').onchange = applyFilters;
$('#auto').onchange = applyFilters;
</script>

</body>
</html>
